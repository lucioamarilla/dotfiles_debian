; =============================================================
; polybar — config para dotfiles Debian (barra inferior, sober)
; RAM de polybar ~30-45MB. Módulos incluidos en modules.ini.
; =============================================================
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/main]
monitor = ${env:MONITOR:}
bottom = true
border-size = 0
height = 28
radius = 0
fixed-center = true

background  = ${colors.background}
foreground  = ${colors.foreground}
line-color  = ${colors.background2}
border-color = ${colors.background}

padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = "JetBrains Mono:size=10;2"
font-1 = "Noto Sans:size=10;2"
font-2 = "Symbols Nerd Font Mono:size=9;2"

; Tray (nm-applet, blueman tray)
tray-position = right
tray-detached = false
tray-maxsize = 16
tray-background = ${colors.background}
tray-offset-x = 0
tray-spacing = 4px

; Módulos
modules-left  = bspwm
modules-right = filesystem cpu memory network volume battery date sysmenu

wm-restack = bspwm
override-redirect = false

; Soporte de scroll en módulos
enable-scroll = false

; cursor
cursor-click = pointer
screenchange-reload = false
