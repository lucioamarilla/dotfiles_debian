; =============================================================
; modules.ini — módulos polybar (sin íconos jóvenes: fail-safe)
; Referencias: ${colors.*} en colors.ini | ${env:BAT:...}
; =============================================================

[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-background = ${colors.ws-active-bg}
label-focused-foreground = ${colors.ws-active-fg}
label-focused-padding = 1

label-occupied = %index%
label-occupied-foreground = ${colors.foreground2}
label-occupied-padding = 1

label-urgent = %index%!
label-urgent-foreground = ${colors.urgent}
label-urgent-background = ${colors.background2}
label-urgent-padding = 1

label-empty = %index%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

label-separator = " "
label-separator-padding = 0

[module/title]
type = internal/xwindow
label = %title:0:70:...%
label-foreground = ${colors.foreground2}
label-empty = "Desktop"
label-maxlen = 70

[module/filesystem]
type = internal/fs
interval = 90
mount-0 = /
label-mounted = "DISK %used%"
label-mounted-foreground = ${colors.foreground2}
label-unmounted = ""
label-unmounted-foreground = ${colors.disabled}

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
label = "CPU %percentage-sum:2%%"
label-foreground = ${colors.foreground2}
ramp-coreload-spacing = 0

[module/memory]
type = internal/memory
interval = 5
label = "RAM %percentage_used:2%%"
label-foreground = ${colors.foreground2}

[module/network]
type = internal/network
interval = 5
; interface-type soporta wired y wireless a la vez (polybar >= 3.7)
interface-type = wired wireless
format-connected = <label-connected>
label-connected = "%netspeed% · [%essid:0:14%]"

format-disconnected = <label-disconnected>
label-disconnected = NET desconectado
label-disconnected-foreground = ${colors.alert}
label-disconnected-background = ${colors.background2}

[module/volume]
type = internal/pactl
interval = 5
; Debian: polybar 3.7 usa internal/pactl (libpulse)
label-volume = "VOL %volume%%"
label-volume-foreground = ${colors.foreground2}
label-muted = MUTE
label-muted-foreground = ${colors.alert}

[module/battery]
type = internal/battery
battery = ${env:BAT:battery0}
adapter = ${env:AC:AC}
full-at = 98
interval = 15
poll-interval = 30
low-at = 15

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

label-charging = "%percentage%% ↑"
label-discharging = "%percentage%%"
label-full = "FULL"
label-low = "%percentage%%"
label-low-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 5
date = %d/%m
time = %H:%M
label = %date% · %time%
label-foreground = ${colors.foreground}

[module/sysmenu]
type = custom/script
exec = echo "⏻"
interval = 3600
click-left = PowerMenu
label = "%output%"
label-foreground = ${colors.foreground}
