# =============================================================
#  picom — preset HARDWARE real (ThinkPad i3-10110U, UHD Gráficos)
#  Backend glx + fade simple. Sin blur (0 costo GPU).
#  Para VirtualBox usar picom-vm.conf (backend xrender).
# =============================================================

backend = "glx";
vsync = true;

glx-no-stencil = true;
glx-no-rebind-pictures = true;
glx-swap-method = 1;
xrender-sync-fence = true;

# ── blending / sombras ──────────────────────────────────────
shadow = false;
fading = true;
fade-delta = 8;            # animación fade suave y liviana
fade-in-step = 0.06;
fade-out-step = 0.09;
fade-exclude = [
  "class_g = 'BsQty'"      # nada excluido por defecto
];

blur-background = false;
blur-method = "none";

# ── opacidad ────────────────────────────────────────────────
# Sin transparencias globales (ahorra composición); usar 'picom-trans'
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'Alacritty' && focused",
  "95:class_g = 'Alacritty' && !focused",
  "100:class_g = 'Rofi' && class_i = 'rofi- skull'"
];

# ── anti-flicker: ventanas que no se sombrean ───────────────
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Dunst'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ── fullscreen: desactivar vsync/unredirect para FPS ────────
unredir-if-possible = true;
unredir-if-possible-exclude = [];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovwin-focused = true;
