# =============================================================
#  picom — preset MÁQUINA VIRTUAL (VirtualBox / GPU emulada)
#  Backend xrender (ningún efecto DirectX necesario), fade off.
# =============================================================

backend = "xrender";
vsync = false;

shadow = false;
fading = false;

blur-background = false;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

unredir-if-possible = false;

# Igual que real: sin sombras en barras/notificaciones
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Dunst'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovwin-focused = true;
use-damage = true;
